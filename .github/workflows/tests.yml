name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: diamond_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/diamond_test?serverVersion=8.0&charset=utf8mb4"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, mbstring, xml, dom, curl, pdo, pdo_mysql, intl, zip
          coverage: none
          tools: composer:v2

      - name: Display PHP info
        run: php -v && php -m

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader --no-scripts

      - name: Clear Symfony cache for test environment
        run: php bin/console cache:clear --env=test --no-interaction

      - name: Generate JWT keys
        run: |
          mkdir -p config/jwt
          php -r "\$privateKey = openssl_pkey_new(['digest_alg' => 'sha512', 'private_key_bits' => 4096, 'private_key_type' => OPENSSL_KEYTYPE_RSA]); openssl_pkey_export(\$privateKey, \$privateKeyString); file_put_contents('config/jwt/private.pem', \$privateKeyString); \$publicKey = openssl_pkey_get_details(\$privateKey)['key']; file_put_contents('config/jwt/public.pem', \$publicKey);"


      - name: Prepare test database
        run: |
          php bin/console doctrine:database:drop --env=test --force --no-interaction || true
          php bin/console doctrine:database:create --env=test --no-interaction
          php bin/console doctrine:migrations:migrate --env=test --no-interaction --allow-no-migration

      - name: Load fixtures
        run: php bin/console doctrine:fixtures:load --env=test --no-interaction

      - name: Run PHPUnit tests
        run: vendor/bin/phpunit --testdox

      - name : Show test log on failure
        if: failure()
        run: tail -n 100 var/log/test.log || true

      - name : Install importmap assets
        run: php bin/console importmap:install --no-interaction -v ls -la assets/vendor
             php bin/console asset-map:compile --env-test --no-interaction 